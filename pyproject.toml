[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flap-ontology"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "google-genai",
    "anthropic",
    "openai",
    "biopython",
    "owlready2",
    "concepts",
    "pandas",
    "pydantic>=1,<3",
    "python-dotenv",
    "networkx",
    "rdflib",
    "torch",
    "transformers",
    "scikit-learn",
    "rapidfuzz",
    "pytest-asyncio",
]